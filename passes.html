<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Passes</title>

    <link rel="stylesheet" href="popup.css">
    <script src="content.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Mega&display=swap" rel="stylesheet">
</head>
<body>
    <div class="pass-menu" id="id-pm">
        <div id="paper-details">
            <h1 id="paperTitle">Research Title</h1>

            <h3 id="id-aoi">Author, other info</h3>
        </div>

        <div class="pass-container" id="id-pc">
            <div class="pass-object" id="first-po">
                <h2>First Pass</h2>
            </div>

            <div class="pass-object" id="second-po">
                <h2>Second Pass</h2>
            </div>

            <div class="pass-object" id="third-po">
                <h2>Third Pass</h2>
            </div>
        </div>

        <button class="button-base" id="pass-submit">Done</button>
    </div>
</body>
</html>
